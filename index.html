<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人自律与资产管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #F4F1EA;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .neo-box {
      background: #FFFFFF;
      border: 3px solid #2A2E35;
      box-shadow: 4px 4px 0px #2A2E35;
    }
    .neo-btn {
      border: 2px solid #2A2E35;
      box-shadow: 2px 2px 0px #2A2E35;
      transition: all 0.1s ease;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #2A2E35;
    }
  </style>
</head>
<body class="p-3 md:p-6 text-[#2A2E35] max-w-5xl mx-auto space-y-6">

  <!-- 顶部统计栏 -->
  <header class="neo-box p-4 rounded-2xl flex flex-wrap justify-between items-center bg-[#FFF8E7]">
    <div>
      <h1 class="text-xl font-black flex items-center gap-2">
        <span>🎯</span> 个人自律与资产管理控制台
      </h1>
      <p class="text-xs font-bold text-gray-500 mt-1">按日历独立记录与查阅 | 保持自律，积少成多</p>
    </div>
    <div class="flex gap-3 mt-2 sm:mt-0">
      <div class="bg-[#E2F0D9] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>🪙 积分:</span>
        <span id="stat-pts" class="text-base text-green-700 font-black">0</span>
      </div>
      <div class="bg-[#FFF2B8] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>🎟️ 补签卡:</span>
        <span id="stat-repair" class="text-base text-amber-700 font-black">0</span>
        <button onclick="buyRepairCard()" class="ml-1 neo-btn bg-white px-1.5 py-0.5 text-[10px] rounded">兑换(50pt)</button>
      </div>
      <div class="bg-[#E8F1F5] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>💰 净资产:</span>
        <span id="stat-asset" class="text-base text-blue-700 font-black">￥0.00</span>
      </div>
    </div>
  </header>

  <!-- 日历面板（按日查阅核心） -->
  <section class="neo-box p-4 rounded-2xl">
    <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
      <h2 class="font-black text-sm flex items-center gap-1">
        <span>📅</span> 日历查阅视角 (当前查看: <span id="selected-date-display" class="text-blue-600 underline">--</span>)
      </h2>
      <div class="flex items-center gap-2">
        <button onclick="goToToday()" class="neo-btn bg-[#FFF2B8] px-2 py-0.5 rounded font-black text-xs">
          📍 切回今天
        </button>
        <button onclick="changeMonth(-1)" class="neo-btn bg-white px-2 py-0.5 rounded font-bold text-xs">← 上月</button>
        <span id="calendar-month-title" class="font-black text-xs">----年--月</span>
        <button onclick="changeMonth(1)" class="neo-btn bg-white px-2 py-0.5 rounded font-bold text-xs">下月 →</button>
      </div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-bold">
      <!-- JavaScript 动态渲染日历 -->
    </div>
  </section>

  <!-- Tab 导航 -->
  <nav class="flex gap-2">
    <button onclick="switchTab('habit')" id="tab-btn-habit" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-[#FFE5EC]">
      🔥 习惯打卡
    </button>
    <button onclick="switchTab('todo')" id="tab-btn-todo" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-white">
      📋 待办事项 (四象限)
    </button>
    <button onclick="switchTab('finance')" id="tab-btn-finance" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-white">
      💳 记账与资产
    </button>
  </nav>

  <!-- 内容区 1: 习惯打卡 -->
  <main id="tab-habit" class="space-y-4">
    <div class="neo-box p-4 rounded-2xl bg-white">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-base flex items-center gap-1">
          <span>⚡</span> 每日习惯列表
        </h2>
        <button onclick="addHabit()" class="neo-btn bg-[#E2F0D9] px-3 py-1 rounded-xl text-xs font-black">
          + 添加新习惯
        </button>
      </div>
      <div id="habit-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- JS 动态渲染 -->
      </div>
    </div>
  </main>

  <!-- 内容区 2: 待办事项 -->
  <main id="tab-todo" class="space-y-4 hidden">
    <div class="neo-box p-4 rounded-2xl bg-white">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-base flex items-center gap-1">
          <span>🎯</span> 时间管理四象限
        </h2>
        <button onclick="addQuickTodo()" class="neo-btn bg-[#FFF2B8] px-3 py-1 rounded-xl text-xs font-black">
          + 新建待办事项
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#FFD1D1]">
          <h3 class="font-black text-xs mb-2 text-red-800">🚨 1. 紧急且重要</h3>
          <div id="quad-1" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#D4F0F0]">
          <h3 class="font-black text-xs mb-2 text-teal-800">🌟 2. 重要不紧急</h3>
          <div id="quad-2" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#FFE5D9]">
          <h3 class="font-black text-xs mb-2 text-orange-800">⚡ 3. 紧急不重要</h3>
          <div id="quad-3" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#E2ECE9]">
          <h3 class="font-black text-xs mb-2 text-gray-700">☕ 4. 顺手/不紧急不重要</h3>
          <div id="quad-4" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <div class="neo-box p-4 rounded-2xl bg-white">
      <h3 class="font-black text-xs mb-3 text-gray-600 flex items-center gap-1">
        <span>⏰</span> 所选日期时间轴清单
      </h3>
      <div id="timeline-list" class="space-y-2"></div>
    </div>
  </main>

  <!-- 内容区 3: 记账与资产 -->
  <main id="tab-finance" class="space-y-4 hidden">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="neo-box p-4 rounded-2xl bg-white md:col-span-1 space-y-3">
        <h2 class="font-black text-base flex items-center gap-1">✍️ 记一笔</h2>
        <div>
          <label class="block text-xs font-bold mb-1">收支类型</label>
          <select id="fin-type" class="w-full neo-btn p-2 rounded-xl text-xs font-bold bg-white">
            <option value="exp">🔴 支出</option>
            <option value="inc">🟢 收入</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">金额 (￥)</label>
          <input type="number" id="fin-amount" placeholder="0.00" class="w-full neo-btn p-2 rounded-xl text-xs font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">分类/备注</label>
          <input type="text" id="fin-note" placeholder="如：餐饮、工资" class="w-full neo-btn p-2 rounded-xl text-xs font-bold">
        </div>
        <button onclick="addFinanceRecord()" class="w-full neo-btn bg-[#D4F0F0] py-2 rounded-xl text-xs font-black">
          保存记录
        </button>
      </div>

      <div class="neo-box p-4 rounded-2xl bg-white md:col-span-2 space-y-3">
        <h2 class="font-black text-base">📜 收支明细记录</h2>
        <div id="finance-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1"></div>
      </div>
    </div>
  </main>

    <script>
    let currentTodoView = 'matrix';
    const todayStr = new Date().toISOString().split('T')[0];
    let selectedCalendarDate = todayStr;

    const initialCleanStore = {
      lastDate: todayStr, // 记录最后一次打开页面的日期
      totalPoints: 0,
      todayPoints: 0,
      pointLogs: [],
      todos: [],
      diaries: [],
      studies: [],
      habits: [],
      books: [],
      sports: [],
      movies: [],
      finances: [],
      finCategories: ["🍜 餐饮", "🛍 购物", "🎮 娱乐", "🚌 交通", "📖 学习"],
      rewards: []
    };

    let store = JSON.parse(localStorage.getItem('lego_zx_data_v8')) || initialCleanStore;

    // ==================== 隔夜自动清理逻辑 ====================
    function checkAndCleanOvernightData() {
      // 兼容旧数据中没有 lastDate 的情况
      if (!store.lastDate) {
        store.lastDate = todayStr;
      }

      // 如果当前日期不等于上一次保存的日期（说明发生了跨天）
      if (store.lastDate !== todayStr) {
        // 1. 自动清理隔夜未完成的待办事项 (done: false)，仅保留已完成的 (done: true) 归档在历史记录中
        if (store.todos && store.todos.length > 0) {
          store.todos = store.todos.filter(todo => todo.done === true);
        }

        // 2. 重置每日积分统计（累计总积分 totalPoints 保持不变）
        store.todayPoints = 0;

        // 3. 更新系统最后记录日期为今天
        store.lastDate = todayStr;

        // 保存清理后的数据
        localStorage.setItem('lego_zx_data_v8', JSON.stringify(store));
      }
    }

    // 页面加载时优先运行隔夜清理检测
    checkAndCleanOvernightData();

    document.addEventListener("DOMContentLoaded", () => {
      if (document.getElementById('movie-date')) document.getElementById('movie-date').value = todayStr;
      if (document.getElementById('sport-date')) document.getElementById('sport-date').value = todayStr;
      if (document.getElementById('fin-date')) document.getElementById('fin-date').value = todayStr;
    });

    function saveData() {
      store.lastDate = todayStr; // 每次保存时更新日期
      localStorage.setItem('lego_zx_data_v8', JSON.stringify(store));
      render();
    }

    function resetAllData() {
      if (confirm("⚠️ 确定要清空所有的积分、待办打卡、记账、运动和 Movie 记录吗？此操作不可撤销！")) {
        store = JSON.parse(JSON.stringify(initialCleanStore));
        saveData();
        alert("🧹 所有数据已成功清零！开启全新的自律旅程！");
      }
    }

    function addPointLog(source, amount) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      store.pointLogs.unshift({
        id: Date.now(),
        source,
        amount,
        date: todayStr,
        time
      });
      store.totalPoints += amount;
      if (amount > 0) store.todayPoints += amount;
    }

    function deletePointLog(id) {
      const target = store.pointLogs.find(l => l.id === id);
      if (target) {
        store.totalPoints -= target.amount;
        if (target.date === todayStr && target.amount > 0) store.todayPoints -= target.amount;
        store.pointLogs = store.pointLogs.filter(l => l.id !== id);
        saveData();
      }
    }

    function manualAdjustPoints() {
      const reason = prompt("请输入调整原因:", "手动调整");
      if (!reason) return;
      const amount = parseInt(prompt("请输入变动数值 (扣分为负数，例: -20 或 50):", "-10"));
      if (isNaN(amount) || amount === 0) return;

      addPointLog(`[手动调整] ${reason}`, amount);
      saveData();
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').innerText = `${hours}:${minutes}`;
      document.getElementById('header-time').innerText = now.toLocaleDateString('zh-CN');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function switchTab(tabKey) {
      document.querySelectorAll('.tab-page').forEach(el => el.classList.add('hidden'));
      document.getElementById(`page-${tabKey}`).classList.remove('hidden');

      document.querySelectorAll('nav button').forEach(el => {
        el.classList.remove('active-nav-item');
        el.classList.add('text-[#3157A4]');
      });
      const activeBtn = document.getElementById(`nav-${tabKey}`);
      if(activeBtn) {
        activeBtn.classList.add('active-nav-item');
        activeBtn.classList.remove('text-[#3157A4]');
      }

      if (tabKey === 'finance') {
        renderFinancePieChart();
      }
    }

    function switchTodoView(viewType) {
      currentTodoView = viewType;
      const matrixBtn = document.getElementById('view-matrix-btn');
      const timelineBtn = document.getElementById('view-timeline-btn');
      const matrixBox = document.getElementById('todo-matrix-view');
      const timelineBox = document.getElementById('todo-timeline-view');

      if (viewType === 'matrix') {
        matrixBtn.className = "flex-1 py-1 rounded-lg bg-[#3157A4] text-white border border-[#2A2E35]";
        timelineBtn.className = "flex-1 py-1 rounded-lg text-gray-600";
        matrixBox.classList.remove('hidden');
        timelineBox.classList.add('hidden');
      } else {
        timelineBtn.className = "flex-1 py-1 rounded-lg bg-[#3157A4] text-white border border-[#2A2E35]";
        matrixBtn.className = "flex-1 py-1 rounded-lg text-gray-600";
        timelineBox.classList.remove('hidden');
        matrixBox.classList.add('hidden');
      }
      render();
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function addCustomCategoryPrompt() {
      const cat = prompt("输入新分类名称 (可加 Emoji，例: ☕️ 咖啡):");
      if (cat && cat.trim()) {
        if (!store.finCategories.includes(cat.trim())) {
          store.finCategories.push(cat.trim());
          saveData();
        }
      }
    }

    function saveFinanceRecord() {
      const type = document.getElementById('fin-type').value;
      const amount = parseFloat(document.getElementById('fin-amount').value);
      const category = document.getElementById('fin-category').value;
      const date = document.getElementById('fin-date').value || todayStr;
      const note = document.getElementById('fin-[#3157A4]').value.trim();

      if (isNaN(amount) || amount <= 0) {
        alert("请输入有效的金额！");
        return;
      }

      store.finances.unshift({
        id: Date.now(),
        type,
        amount,
        category,
        date,
        note
      });

      document.getElementById('fin-amount').value = "";
      document.getElementById('fin-[#3157A4]').value = "";

      addPointLog(`[记账] ${category} ${amount}元`, 2);
      saveData();
    }

    function deleteFinanceRecord(id) {
      store.finances = store.finances.filter(f => f.id !== id);
      saveData();
    }

    function renderFinancePieChart() {
      const canvas = document.getElementById('financePieChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const expenses = store.finances.filter(f => f.type === 'expense');
      const categoryTotals = {};
      let totalExpense = 0;

      expenses.forEach(item => {
        categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.amount;
        totalExpense += item.amount;
      });

      const legendBox = document.getElementById('pie-legend');

      if (totalExpense === 0) {
        ctx.fillStyle = '#E5E7EB';
        ctx.beginPath();
        ctx.arc(90, 90, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#9CA3AF';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无支出', 90, 95);
        if (legendBox) legendBox.innerHTML = '<p class="text-gray-400 text-center col-span-2">尚无支出分类数据</p>';
        return;
      }

      const colors = ['#F87171', '#60A5FA', '#FBBF24', '#34D399', '#A78BFA', '#F472B6', '#F97316'];
      let startAngle = 0;
      let legendHTML = '';
      let colorIdx = 0;

      for (const [cat, amt] of Object.entries(categoryTotals)) {
        const sliceAngle = (amt / totalExpense) * (Math.PI * 2);
        const currentColor = colors[colorIdx % colors.length];

        ctx.fillStyle = currentColor;
        ctx.beginPath();
        ctx.moveTo(90, 90);
        ctx.arc(90, 90, 80, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#2A2E35';
        ctx.stroke();

        const pct = Math.round((amt / totalExpense) * 100);
        legendHTML += `
          <div class="flex items-center gap-1.5 bg-white p-1 rounded-md border border-[#2A2E35]">
            <span class="w-3 h-3 rounded-full border border-[#2A2E35]" style="background:${currentColor}"></span>
            <span class="truncate flex-1">${cat}</span>
            <span class="text-gray-500">${pct}%</span>
          </div>
        `;

        startAngle += sliceAngle;
        colorIdx++;
      }

      if (legendBox) legendBox.innerHTML = legendHTML;
    }

    function exportFinanceCSV(range) {
      if (store.finances.length === 0) {
        alert("目前没有可以导出的记账数据！");
        return;
      }

      const now = new Date();
      let filtered = store.finances;

      if (range === 'daily') {
        filtered = store.finances.filter(f => f.date === todayStr);
      } else if (range === 'weekly') {
        const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        filtered = store.finances.filter(f => f.date >= sevenDaysAgo);
      } else if (range === 'monthly') {
        const currentMonth = todayStr.substring(0, 7);
        filtered = store.finances.filter(f => f.date.startsWith(currentMonth));
      }

      if (filtered.length === 0) {
        alert(`未找到 [${range}] 范围内的记账记录！`);
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "日期,类型,分类,金额,备注\n";

      filtered.forEach(item => {
        const typeText = item.type === 'expense' ? '支出' : '收入';
        csvContent += `${item.date},${typeText},${item.category},${item.amount},"${item.note || ''}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `LegoZX_账单_${range}_${todayStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function saveSportRecord() {
      const date = document.getElementById('sport-date').value || todayStr;
      const name = document.getElementById('sport-name').value.trim();
      const duration = document.getElementById('sport-time').value || 30;
      const comment = document.getElementById('sport-comment').value.trim();
      const photoFile = document.getElementById('sport-photo').files[0];

      if (!name) {
        alert("请输入运动项目名称！");
        return;
      }

      let photoData = "";
      if (photoFile) {
        photoData = await getBase64(photoFile);
      }

      store.sports.unshift({
        id: Date.now(),
        date,
        name,
        duration,
        comment,
        photo: photoData
      });

      document.getElementById('sport-name').value = "";
      document.getElementById('sport-comment').value = "";
      document.getElementById('sport-photo').value = "";

      addPointLog(`[运动打卡] ${name}`, 15);
      saveData();
    }

    function deleteSport(id) {
      store.sports = store.sports.filter(s => s.id !== id);
      saveData();
    }

    async function saveMovieRecord() {
      const date = document.getElementById('movie-date').value || todayStr;
      const name = document.getElementById('movie-name').value.trim();
      const duration = document.getElementById('movie-duration').value || 120;
      const rating = document.getElementById('movie-rating').value;
      const review = document.getElementById('movie-review').value.trim();
      const photoFile = document.getElementById('movie-photo').files[0];

      if (!name) {
        alert("请输入电影/剧集名称！");
        return;
      }

      let photoData = "";
      if (photoFile) {
        photoData = await getBase64(photoFile);
      }

      store.movies.unshift({
        id: Date.now(),
        date,
        name,
        duration,
        rating,
        review,
        photo: photoData
      });

      document.getElementById('movie-name').value = "";
      document.getElementById('movie-review').value = "";
      document.getElementById('movie-photo').value = "";

      addPointLog(`[观影手帐] ${name}`, 10);
      saveData();
    }

    function deleteMovie(id) {
      store.movies = store.movies.filter(m => m.id !== id);
      saveData();
    }

    function saveDiary() {
      const mood = document.getElementById('diary-mood').value;
      const weather = document.getElementById('diary-weather').value;
      const content = document.getElementById('diary-content').value.trim();

      if (!content) {
        alert("请先填写日记内容哦！");
        return;
      }

      store.diaries.unshift({
        id: Date.now(),
        mood,
        weather,
        content,
        date: todayStr
      });
      document.getElementById('diary-content').value = "";
      addPointLog(`[日记] 写日记打卡`, 5);
      saveData();
    }

    function deleteDiary(id) {
      store.diaries = store.diaries.filter(d => d.id !== id);
      saveData();
    }

    function addQuickTodo() {
      const icon = prompt("图标 (Emoji):", "📌") || "📌";
      const title = prompt("任务描述:", "");
      if (!title || !title.trim()) return;
      const time = prompt("截止时间 (例 18:00):", "20:00") || "今日";
      const quad = parseInt(prompt("象限分组:\n1-紧急重要\n2-重要不紧急\n3-紧急不重要\n4-顺手完成", "1")) || 1;
      const pts = parseInt(prompt("完成奖励积分:", "10")) || 10;

      store.todos.push({
        id: Date.now(),
        icon,
        title: title.trim(),
        quad: Math.min(4, Math.max(1, quad)),
        time,
        done: false,
        pts,
        date: todayStr
      });
      saveData();
    }

    function toggleTodo(id) {
      const todo = store.todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        if (todo.done) {
          addPointLog(`[待办] ${todo.title}`, todo.pts);
        } else {
          addPointLog(`[取消待办] ${todo.title}`, -todo.pts);
        }
        saveData();
      }
    }

    function deleteTodo(id) {
      store.todos = store.todos.filter(t => t.id !== id);
      saveData();
    }

    function recordStudy() {
      const icon = document.getElementById('study-icon').value || '📝';
      const subject = document.getElementById('study-subject').value || '未分类';
      const time = parseInt(document.getElementById('study-time').value) || 30;
      const pts = parseInt(document.getElementById('study-pts').value) || 15;

      store.studies.unshift({
        id: Date.now(),
        icon,
        subject,
        time,
        pts,
        date: todayStr
      });
      addPointLog(`[学习] ${subject}`, pts);
      saveData();
    }

    function deleteStudy(id) {
      store.studies = store.studies.filter(s => s.id !== id);
      saveData();
    }

    function toggleHabit(id) {
      const habit = store.habits.find(h => h.id === id);
      if (habit) {
        habit.done = !habit.done;
        if (habit.done) {
          addPointLog(`[打卡] ${habit.name}`, habit.pts);
        } else {
          addPointLog(`[取消打卡] ${habit.name}`, -habit.pts);
        }
        saveData();
      }
    }

    function addNewHabitPrompt() {
      const icon = prompt("图标 Emoji:", "🌱") || "🌱";
      const name = prompt("打卡名称:", "");
      if (name) {
        store.habits.push({ id: Date.now(), icon, name, pts: 10, done: false });
        saveData();
      }
    }

    function deleteHabit(id) {
      store.habits = store.habits.filter(h => h.id !== id);
      saveData();
    }

    function addBookProgress() {
      const icon = document.getElementById('book-icon').value || '📖';
      const title = document.getElementById('book-title').value || '新书';
      const total = parseInt(document.getElementById('book-total-pages').value) || 200;
      const read = parseInt(document.getElementById('book-read-pages').value) || 0;

      const existing = store.books.find(b => b.title === title);
      if (existing) {
        existing.read = read;
        existing.total = total;
        existing.icon = icon;
      } else {
        store.books.push({ id: Date.now(), icon, title, total, read });
      }
      addPointLog(`[阅读] ${title}`, 5);
      saveData();
    }

    function deleteBook(id) {
      store.books = store.books.filter(b => b.id !== id);
      saveData();
    }

    function redeemReward(cost, name) {
      if (store.totalPoints >= cost) {
        addPointLog(`[兑换奖励] ${name}`, -cost);
        alert(`🎉 成功兑换: ${name}！已经扣除 ${cost} 积分`);
        saveData();
      } else {
        alert(`⚠️ 积分不足！还差 ${cost - store.totalPoints} 积分。`);
      }
    }

    function addRewardPrompt() {
      const icon = prompt("图标 Emoji:", "🎁") || "🎁";
      const name = prompt("奖励名称:", "");
      if (!name) return;
      const cost = parseInt(prompt("需要积分:", "100")) || 100;
      store.rewards.push({ id: Date.now(), icon, name, cost });
      saveData();
    }

    function deleteReward(id) {
      store.rewards = store.rewards.filter(r => r.id !== id);
      saveData();
    }

    function exportData() {
      const jsonStr = JSON.stringify(store);
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert("📋 数据备份已复制到剪贴板！您可以粘贴保存到备忘录。");
      }).catch(() => {
        prompt("请复制下方代码进行备份：", jsonStr);
      });
    }

    function importData() {
      const jsonStr = prompt("请粘贴之前备份的数据 JSON 代码：");
      if (jsonStr) {
        try {
          store = JSON.parse(jsonStr);
          checkAndCleanOvernightData(); // 导入数据后立即检查一次隔夜清理
          saveData();
          alert("🎉 数据导入成功！");
        } catch (e) {
          alert("⚠️ 导入失败，代码格式不正确！");
        }
      }
    }

    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const gridBox = document.getElementById('calendar-grid');
      gridBox.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        gridBox.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isSelected = dateKey === selectedCalendarDate;
        gridBox.innerHTML += `
          <button onclick="selectCalendarDate('${dateKey}')" class="calendar-day-btn ${isSelected ? 'calendar-day-selected' : ''}">
            ${day}
          </button>
        `;
      }
    }

    function selectCalendarDate(dateKey) {
      selectedCalendarDate = dateKey;
      renderCalendar();
      renderSelectedDateDetails();
    }

    function renderSelectedDateDetails() {
      document.getElementById('selected-date-label').innerText = selectedCalendarDate === todayStr ? '今日' : selectedCalendarDate;
      
      const dayTodos = store.todos.filter(t => t.date === selectedCalendarDate);
      const todoBox = document.getElementById('calendar-todo-list');
      if (dayTodos.length > 0) {
        todoBox.innerHTML = dayTodos.map(t => `
          <div class="flex justify-between items-center p-2 bg-gray-50 border border-[#2A2E35] rounded-lg">
            <span class="${t.done ? 'line-through text-gray-400' : ''} font-bold">${t.icon} ${t.title}</span>
            <span class="text-[10px] text-gray-400 font-bold">${t.time}</span>
          </div>
        `).join('');
      } else {
        todoBox.innerHTML = '<p class="text-gray-400 italic text-[11px]">当天没有事项</p>';
      }

      const dayLogs = store.pointLogs.filter(l => l.date === selectedCalendarDate);
      const logBox = document.getElementById('calendar-point-list');
      let daySum = 0;

      if (dayLogs.length > 0) {
        logBox.innerHTML = dayLogs.map(l => {
          daySum += l.amount;
          return `
            <div class="flex justify-between items-center p-1.5 bg-[#FFF2B8] border border-[#2A2E35] rounded-md font-bold text-[11px]">
              <span>${l.time || ''} ${l.source}</span>
              <span class="${l.amount >= 0 ? 'text-emerald-600' : 'text-red-500'} font-black">${l.amount >= 0 ? '+' : ''}${l.amount}</span>
            </div>
          `;
        }).join('');
      } else {
        logBox.innerHTML = '<p class="text-gray-400 italic text-[11px]">当天没有积分记录</p>';
      }

      document.getElementById('selected-date-pts-badge').innerText = `积分: ${daySum >= 0 ? '+' : ''}${daySum} pt`;
    }

    function render() {
      document.getElementById('stat-total-pts').innerText = store.totalPoints;
      document.getElementById('points-tab-total').innerText = store.totalPoints;
      document.getElementById('stat-today-pts').innerText = `${store.todayPoints >= 0 ? '+' : ''}${store.todayPoints}`;
      document.getElementById('points-tab-today').innerText = `${store.todayPoints >= 0 ? '+' : ''}${store.todayPoints}`;

      // 只获取今天的待办列表渲染到待办页和总览数据
      const todayTodos = store.todos.filter(t => t.date === todayStr);
      const completedCount = todayTodos.filter(t => t.done).length;
      document.getElementById('stat-tasks-total').innerText = todayTodos.length;
      document.getElementById('stat-tasks-done').innerText = completedCount;

      renderCalendar();
      renderSelectedDateDetails();

      const catSelect = document.getElementById('fin-category');
      if (catSelect) {
        catSelect.innerHTML = store.finCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      }

      const finBox = document.getElementById('finance-history-list');
      if (store.finances && store.finances.length > 0) {
        finBox.innerHTML = store.finances.map(f => `
          <div class="flex justify-between items-center p-2.5 bg-white border-2 border-[#2A2E35] rounded-xl font-bold">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs">${f.category}</span>
                <span class="text-[10px] text-gray-400">📅 ${f.date}</span>
              </div>
              ${f.note ? `<p class="text-[10px] text-gray-500 font-normal">💬 ${f.note}</p>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="${f.type === 'expense' ? 'text-red-500' : 'text-emerald-600'} font-black text-sm">
                ${f.type === 'expense' ? '-' : '+'}$${f.amount.toFixed(2)}
              </span>
              <button onclick="deleteFinanceRecord(${f.id})" class="text-gray-300 hover:text-red-500">×</button>
            </div>
          </div>
        `).join('');
      } else {
        finBox.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">暂无记账明细</p>';
      }

      renderFinancePieChart();

      const sportBox = document.getElementById('sport-history-list');
      if (store.sports && store.sports.length > 0) {
        sportBox.innerHTML = store.sports.map(s => `
          <div class="p-3 bg-white border-2 border-[#2A2E35] rounded-xl space-y-2 font-bold">
            <div class="flex justify-between items-center text-gray-500 text-[10px]">
              <span>📅 ${s.date} | ⏱️ ${s.duration}分钟</span>
              <button onclick="deleteSport(${s.id})" class="text-gray-300 hover:text-red-500 text-sm">×</button>
            </div>
            <p class="text-slate-800 text-sm font-extrabold">⚽️ ${s.name}</p>
            ${s.photo ? `<img src="${s.photo}" class="w-full h-40 object-cover rounded-lg border-2 border-[#2A2E35]">` : ''}
            ${s.comment ? `<p class="text-gray-600 text-xs bg-[#FFF2B8] p-2 rounded-lg border border-[#2A2E35]">💬 ${s.comment}</p>` : ''}
          </div>
        `).join('');
      } else {
        sportBox.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">还没有运动打卡，动起来吧！</p>';
      }

      const movieBox = document.getElementById('movie-history-list');
      if (store.movies && store.movies.length > 0) {
        movieBox.innerHTML = store.movies.map(m => `
          <div class="p-3 bg-white border-2 border-[#2A2E35] rounded-xl space-y-2 font-bold">
            <div class="flex justify-between items-center text-gray-500 text-[10px]">
              <span>📅 ${m.date} | ⏱️ ${m.duration}分钟</span>
              <button onclick="deleteMovie(${m.id})" class="text-gray-300 hover:text-red-500 text-sm">×</button>
            </div>
            <div class="flex justify-between items-center">
              <p class="text-slate-800 text-sm font-extrabold">🎬 ${m.name}</p>
              <span class="text-xs">${m.rating}</span>
            </div>
            ${m.photo ? `<img src="${m.photo}" class="w-full h-44 object-cover rounded-lg border-2 border-[#2A2E35]">` : ''}
            ${m.review ? `<p class="text-gray-600 text-xs bg-[#FFF2B8] p-2 rounded-lg border border-[#2A2E35]">📝 ${m.review}</p>` : ''}
          </div>
        `).join('');
      } else {
        movieBox.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">还没有 Movie 记录，去看看好看的电影吧！</p>';
      }

      const pointLogBox = document.getElementById('point-log-list');
      if (store.pointLogs && store.pointLogs.length > 0) {
        pointLogBox.innerHTML = store.pointLogs.map(log => `
          <div class="flex justify-between items-center p-2 bg-[#FFF2B8] rounded-lg border-2 border-[#2A2E35] font-bold">
            <div class="flex items-center gap-1.5 overflow-hidden">
              <span class="text-gray-400 text-[10px]">${log.date || ''} ${log.time || ''}</span>
              <span class="truncate text-slate-800">${log.source}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="${log.amount >= 0 ? 'text-emerald-600' : 'text-red-500'} font-black">
                ${log.amount >= 0 ? '+' : ''}${log.amount} pt
              </span>
              <button onclick="deletePointLog(${log.id})" class="text-gray-400 hover:text-red-500 text-sm font-black">×</button>
            </div>
          </div>
        `).join('');
      } else {
        pointLogBox.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">暂无积分变动记录</p>';
      }

      const diaryBox = document.getElementById('diary-history');
      if (store.diaries && store.diaries.length > 0) {
        diaryBox.innerHTML = store.diaries.map(d => `
          <div class="p-3 bg-white border-2 border-[#2A2E35] rounded-xl space-y-1 font-bold">
            <div class="flex justify-between items-center text-gray-500 text-[10px]">
              <span>📅 ${d.date} | ${d.mood} | ${d.weather}</span>
              <button onclick="deleteDiary(${d.id})" class="text-gray-300 hover:text-red-500 text-sm">×</button>
            </div>
            <p class="text-slate-800 text-xs leading-relaxed">${d.content}</p>
          </div>
        `).join('');
      } else {
        diaryBox.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-2">还没有日记，快去写下第一篇吧！</p>';
      }

      // 象限待办只包含今日的
      for (let i = 1; i <= 4; i++) {
        const quadBox = document.getElementById(`quad-${i}`);
        const items = todayTodos.filter(t => t.quad === i);
        quadBox.innerHTML = items.map(t => `
          <div class="bg-white p-2 rounded-lg border-2 border-[#2A2E35] space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-bold flex items-center gap-1">
                <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTodo(${t.id})" class="accent-[#3157A4]">
                <span class="${t.done ? 'line-through text-gray-400' : ''}">${t.icon} ${t.title}</span>
              </span>
              <button onclick="deleteTodo(${t.id})" class="text-gray-400 hover:text-red-500 font-bold">×</button>
            </div>
            <div class="flex justify-between text-[10px] text-gray-400 font-bold">
              <span>⏰ ${t.time}</span>
              <span class="text-amber-500">+${t.pts}pt</span>
            </div>
          </div>
        `).join('') || '<p class="text-[10px] text-gray-400 italic">暂无事项</p>';
      }

      // 时间轴待办只包含今日的
      const timelineBox = document.getElementById('timeline-list');
      timelineBox.innerHTML = todayTodos.length > 0 ? todayTodos.map(t => `
        <div class="flex items-center gap-2 p-2.5 bg-white border-2 border-[#2A2E35] rounded-xl">
          <span class="bg-[#FFF2B8] px-2 py-0.5 rounded-md border border-[#2A2E35] font-black text-[10px]">${t.time}</span>
          <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTodo(${t.id})" class="accent-[#3157A4]">
          <span class="flex-1 font-bold ${t.done ? 'line-through text-gray-400' : ''}">${t.icon} ${t.title}</span>
          <span class="text-xs font-black text-amber-500">+${t.pts}</span>
          <button onclick="deleteTodo(${t.id})" class="text-gray-300 hover:text-red-500 font-bold ml-1">×</button>
        </div>
      `).join('') : '<p class="text-xs text-gray-400 italic text-center py-2">暂无待办事项</p>';

      document.getElementById('study-history').innerHTML = store.studies.length > 0 ? store.studies.map(s => `
        <div class="flex justify-between items-center p-2.5 bg-white border-2 border-[#2A2E35] rounded-xl font-bold">
          <span>${s.icon} ${s.subject} (${s.time}分钟)</span>
          <div class="flex items-center gap-2">
            <span class="text-[#3157A4]">+${s.pts} 分</span>
            <button onclick="deleteStudy(${s.id})" class="text-gray-300 hover:text-red-500">×</button>
          </div>
        </div>
      `).join('') : '<p class="text-xs text-gray-400 italic text-center py-2">今天还没有专注记录</p>';

      document.getElementById('habit-list').innerHTML = store.habits.length > 0 ? store.habits.map(h => `
        <div class="flex justify-between items-center p-2.5 bg-white border-2 border-[#2A2E35] rounded-xl font-bold">
          <div class="flex items-center gap-2">
            <span>${h.icon}</span>
            <span class="${h.done ? 'line-through text-gray-400' : ''}">${h.name}</span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleHabit(${h.id})" class="cartoon-btn px-3 py-1 text-xs ${h.done ? 'bg-emerald-300' : ''}">
              ${h.done ? '已打卡 √' : '+10分 打卡'}
            </button>
            <button onclick="deleteHabit(${h.id})" class="text-gray-300 hover:text-red-500">×</button>
          </div>
        </div>
      `).join('') : '<p class="text-xs text-gray-400 italic text-center py-2">暂无打卡习惯，点击上方添加！</p>';

      document.getElementById('book-list').innerHTML = store.books.length > 0 ? store.books.map(b => {
        const percent = Math.min(100, Math.round((b.read / b.total) * 100)) || 0;
        return `
          <div class="p-3 bg-white border-2 border-[#2A2E35] rounded-xl space-y-1.5 font-bold">
            <div class="flex justify-between items-center">
              <span>${b.icon} ${b.title}</span>
              <div class="flex items-center gap-2">
                <span class="text-[#3157A4]">${percent}%</span>
                <button onclick="deleteBook(${b.id})" class="text-gray-300 hover:text-red-500">×</button>
              </div>
            </div>
            <div class="w-full bg-[#FFF2B8] h-3 rounded-full border-2 border-[#2A2E35] overflow-hidden">
              <div class="bg-[#F2C94C] h-full" style="width: ${percent}%"></div>
            </div>
            <p class="text-[10px] text-gray-500">已读 ${b.read} / ${b.total} 页</p>
          </div>
        `;
      }).join('') : '<p class="text-xs text-gray-400 italic text-center py-2">书架空空如也</p>';

      document.getElementById('reward-cards').innerHTML = store.rewards.length > 0 ? store.rewards.map(r => `
        <div class="cartoon-card p-3 flex flex-col justify-between text-center space-y-2 relative">
          <button onclick="deleteReward(${r.id})" class="absolute top-1 right-2 text-gray-300 hover:text-red-500 font-bold text-sm">×</button>
          <div>
            <div class="text-3xl my-1">${r.icon}</div>
            <p class="font-extrabold text-gray-800">${r.name}</p>
            <p class="text-xs font-black text-amber-500 mt-0.5">⭐️ ${r.cost} pts</p>
          </div>
          <button onclick="redeemReward(${r.cost}, '${r.name}')" class="cartoon-btn py-1 text-xs">兑换</button>
        </div>
      `).join('') : '<p class="text-xs text-gray-400 italic col-span-2 text-center py-2">暂无可用奖品</p>';
    }

    render();
  </script>

    
      
        
        
</body>
</html>
