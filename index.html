<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人自律与资产管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #F4F1EA;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .neo-box {
      background: #FFFFFF;
      border: 3px solid #2A2E35;
      box-shadow: 4px 4px 0px #2A2E35;
    }
    .neo-btn {
      border: 2px solid #2A2E35;
      box-shadow: 2px 2px 0px #2A2E35;
      transition: all 0.1s ease;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #2A2E35;
    }
  </style>
</head>
<body class="p-3 md:p-6 text-[#2A2E35] max-w-5xl mx-auto space-y-6">

  <!-- 顶部统计栏 -->
  <header class="neo-box p-4 rounded-2xl flex flex-wrap justify-between items-center bg-[#FFF8E7]">
    <div>
      <h1 class="text-xl font-black flex items-center gap-2">
        <span>🎯</span> 个人自律与资产管理控制台
      </h1>
      <p class="text-xs font-bold text-gray-500 mt-1">按日历独立记录与查阅 | 保持自律，积少成多</p>
    </div>
    <div class="flex gap-3 mt-2 sm:mt-0">
      <div class="bg-[#E2F0D9] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>🪙 积分:</span>
        <span id="stat-pts" class="text-base text-green-700 font-black">0</span>
      </div>
      <div class="bg-[#FFF2B8] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>🎟️ 补签卡:</span>
        <span id="stat-repair" class="text-base text-amber-700 font-black">0</span>
        <button onclick="buyRepairCard()" class="ml-1 neo-btn bg-white px-1.5 py-0.5 text-[10px] rounded">兑换(50pt)</button>
      </div>
      <div class="bg-[#E8F1F5] border-2 border-[#2A2E35] px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
        <span>💰 净资产:</span>
        <span id="stat-asset" class="text-base text-blue-700 font-black">￥0.00</span>
      </div>
    </div>
  </header>

  <!-- 日历面板（按日查阅核心） -->
  <section class="neo-box p-4 rounded-2xl">
    <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
      <h2 class="font-black text-sm flex items-center gap-1">
        <span>📅</span> 日历查阅视角 (当前查看: <span id="selected-date-display" class="text-blue-600 underline">--</span>)
      </h2>
      <div class="flex items-center gap-2">
        <button onclick="goToToday()" class="neo-btn bg-[#FFF2B8] px-2 py-0.5 rounded font-black text-xs">
          📍 切回今天
        </button>
        <button onclick="changeMonth(-1)" class="neo-btn bg-white px-2 py-0.5 rounded font-bold text-xs">← 上月</button>
        <span id="calendar-month-title" class="font-black text-xs">----年--月</span>
        <button onclick="changeMonth(1)" class="neo-btn bg-white px-2 py-0.5 rounded font-bold text-xs">下月 →</button>
      </div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-bold">
      <!-- JavaScript 动态渲染日历 -->
    </div>
  </section>

  <!-- Tab 导航 -->
  <nav class="flex gap-2">
    <button onclick="switchTab('habit')" id="tab-btn-habit" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-[#FFE5EC]">
      🔥 习惯打卡
    </button>
    <button onclick="switchTab('todo')" id="tab-btn-todo" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-white">
      📋 待办事项 (四象限)
    </button>
    <button onclick="switchTab('finance')" id="tab-btn-finance" class="neo-btn px-4 py-2 rounded-xl font-black text-xs bg-white">
      💳 记账与资产
    </button>
  </nav>

  <!-- 内容区 1: 习惯打卡 -->
  <main id="tab-habit" class="space-y-4">
    <div class="neo-box p-4 rounded-2xl bg-white">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-base flex items-center gap-1">
          <span>⚡</span> 每日习惯列表
        </h2>
        <button onclick="addHabit()" class="neo-btn bg-[#E2F0D9] px-3 py-1 rounded-xl text-xs font-black">
          + 添加新习惯
        </button>
      </div>
      <div id="habit-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- JS 动态渲染 -->
      </div>
    </div>
  </main>

  <!-- 内容区 2: 待办事项 -->
  <main id="tab-todo" class="space-y-4 hidden">
    <div class="neo-box p-4 rounded-2xl bg-white">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-base flex items-center gap-1">
          <span>🎯</span> 时间管理四象限
        </h2>
        <button onclick="addQuickTodo()" class="neo-btn bg-[#FFF2B8] px-3 py-1 rounded-xl text-xs font-black">
          + 新建待办事项
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#FFD1D1]">
          <h3 class="font-black text-xs mb-2 text-red-800">🚨 1. 紧急且重要</h3>
          <div id="quad-1" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#D4F0F0]">
          <h3 class="font-black text-xs mb-2 text-teal-800">🌟 2. 重要不紧急</h3>
          <div id="quad-2" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#FFE5D9]">
          <h3 class="font-black text-xs mb-2 text-orange-800">⚡ 3. 紧急不重要</h3>
          <div id="quad-3" class="space-y-2"></div>
        </div>
        <div class="border-2 border-[#2A2E35] p-3 rounded-xl bg-[#E2ECE9]">
          <h3 class="font-black text-xs mb-2 text-gray-700">☕ 4. 顺手/不紧急不重要</h3>
          <div id="quad-4" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <div class="neo-box p-4 rounded-2xl bg-white">
      <h3 class="font-black text-xs mb-3 text-gray-600 flex items-center gap-1">
        <span>⏰</span> 所选日期时间轴清单
      </h3>
      <div id="timeline-list" class="space-y-2"></div>
    </div>
  </main>

  <!-- 内容区 3: 记账与资产 -->
  <main id="tab-finance" class="space-y-4 hidden">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="neo-box p-4 rounded-2xl bg-white md:col-span-1 space-y-3">
        <h2 class="font-black text-base flex items-center gap-1">✍️ 记一笔</h2>
        <div>
          <label class="block text-xs font-bold mb-1">收支类型</label>
          <select id="fin-type" class="w-full neo-btn p-2 rounded-xl text-xs font-bold bg-white">
            <option value="exp">🔴 支出</option>
            <option value="inc">🟢 收入</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">金额 (￥)</label>
          <input type="number" id="fin-amount" placeholder="0.00" class="w-full neo-btn p-2 rounded-xl text-xs font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">分类/备注</label>
          <input type="text" id="fin-note" placeholder="如：餐饮、工资" class="w-full neo-btn p-2 rounded-xl text-xs font-bold">
        </div>
        <button onclick="addFinanceRecord()" class="w-full neo-btn bg-[#D4F0F0] py-2 rounded-xl text-xs font-black">
          保存记录
        </button>
      </div>

      <div class="neo-box p-4 rounded-2xl bg-white md:col-span-2 space-y-3">
        <h2 class="font-black text-base">📜 收支明细记录</h2>
        <div id="finance-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1"></div>
      </div>
    </div>
  </main>

  <script>
    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // 全局日期变量
    let todayStr = formatDate(new Date());
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;
    let selectedCalendarDate = todayStr;

    // 跨日检测：过了零点自动更正“今日”标记，并默认切到新的一天
    function checkDateUpdate() {
      const realToday = formatDate(new Date());
      if (realToday !== todayStr) {
        todayStr = realToday;
        selectedCalendarDate = todayStr;
        currentYear = new Date().getFullYear();
        currentMonth = new Date().getMonth() + 1;
        renderCalendar();
        render();
      }
    }

    // 快捷按钮：随时切回今天
    function goToToday() {
      const d = new Date();
      todayStr = formatDate(d);
      selectedCalendarDate = todayStr;
      currentYear = d.getFullYear();
      currentMonth = d.getMonth() + 1;
      renderCalendar();
      render();
    }

    // 读取与保存 LocalStorage 数据
    let store = JSON.parse(localStorage.getItem('my_life_app_data')) || {
      pts: 0,
      repairCards: 0,
      habits: [],
      checkins: {},
      todos: [],
      finance: []
    };

    function saveData() {
      localStorage.setItem('my_life_app_data', JSON.stringify(store));
      render();
    }

    function switchTab(tab) {
      ['habit', 'todo', 'finance'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = 'neo-btn px-4 py-2 rounded-xl font-black text-xs bg-white';
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tab}`).className = 'neo-btn px-4 py-2 rounded-xl font-black text-xs bg-[#FFE5EC]';
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      renderCalendar();
    }

    function selectDate(dateStr) {
      selectedCalendarDate = dateStr;
      renderCalendar();
      render();
    }

    function renderCalendar() {
      document.getElementById('calendar-month-title').innerText = `${currentYear}年${String(currentMonth).padStart(2, '0')}月`;
      document.getElementById('selected-date-display').innerText = selectedCalendarDate;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = ['日','一','二','三','四','五','六'].map(d => `<div class="text-gray-400 py-1">${d}</div>`).join('');

      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isSelected = dStr === selectedCalendarDate;
        const isToday = dStr === todayStr;

        const hasCheckin = store.checkins[dStr] && store.checkins[dStr].length > 0;
        const hasTodo = store.todos.some(t => t.date === dStr && !t.done);

        grid.innerHTML += `
          <button onclick="selectDate('${dStr}')" class="p-1.5 rounded-lg border flex flex-col items-center justify-between text-xs h-12 ${
            isSelected ? 'border-2 border-blue-600 bg-blue-50 font-black' : 'border-gray-200 bg-white'
          }">
            <span class="${isToday ? 'bg-red-500 text-white rounded-full px-1.5 py-0.2' : ''}">${day}</span>
            <div class="flex gap-0.5 text-[8px]">
              ${hasCheckin ? '🟢' : ''}
              ${hasTodo ? '🔴' : ''}
            </div>
          </button>
        `;
      }
    }

    function addHabit() {
      const name = prompt("输入习惯名称:", "");
      if (!name) return;
      const pts = parseInt(prompt("完成单次奖励积分:", "10")) || 10;
      store.habits.push({ id: Date.now(), name, pts });
      saveData();
    }

    function toggleCheckin(habitId, dateStr) {
      if (!store.checkins[dateStr]) store.checkins[dateStr] = [];
      const list = store.checkins[dateStr];
      const habit = store.habits.find(h => h.id === habitId);
      const index = list.indexOf(habitId);

      // 过去的日期补签校验
      if (dateStr < todayStr && index === -1) {
        if (store.repairCards <= 0) {
          alert("补签过去日期的习惯需要消耗 1 张补签卡！当前补签卡不足。");
          return;
        }
        if (confirm("是否消耗 1 张补签卡补签此习惯？")) {
          store.repairCards--;
          list.push(habitId);
          if (habit) store.pts += habit.pts;
        }
        saveData();
        return;
      }

      if (index > -1) {
        list.splice(index, 1);
        if (habit) store.pts = Math.max(0, store.pts - habit.pts);
      } else {
        list.push(habitId);
        if (habit) store.pts += habit.pts;
      }
      saveData();
    }

    function buyRepairCard() {
      if (store.pts < 50) {
        alert("积分不足！需要 50 积分兑换 1 张补签卡。");
        return;
      }
      store.pts -= 50;
      store.repairCards++;
      saveData();
    }

    function addQuickTodo() {
      const icon = prompt("图标 (Emoji):", "📌") || "📌";
      const title = prompt("任务描述:", "");
      if (!title || !title.trim()) return;
      
      const todoDate = prompt("任务日期 (YYYY-MM-DD):", selectedCalendarDate) || selectedCalendarDate;
      const time = prompt("具体时间 (例 18:00):", "20:00") || "全天";
      const quad = parseInt(prompt("象限分组:\n1-紧急重要\n2-重要不紧急\n3-紧急不重要\n4-顺手/不紧急不重要", "1")) || 1;
      const pts = parseInt(prompt("完成奖励积分:", "10")) || 10;

      store.todos.push({
        id: Date.now(),
        icon,
        title: title.trim(),
        quad: Math.min(4, Math.max(1, quad)),
        time,
        done: false,
        pts,
        date: todoDate
      });
      
      saveData();
    }

    function toggleTodo(todoId) {
      const todo = store.todos.find(t => t.id === todoId);
      if (todo) {
        todo.done = !todo.done;
        if (todo.done) store.pts += todo.pts;
        else store.pts = Math.max(0, store.pts - todo.pts);
      }
      saveData();
    }

    function deleteTodo(todoId) {
      store.todos = store.todos.filter(t => t.id !== todoId);
      saveData();
    }

    function addFinanceRecord() {
      const type = document.getElementById('fin-type').value;
      const amount = parseFloat(document.getElementById('fin-amount').value);
      const note = document.getElementById('fin-note').value.trim() || '未分类';

      if (isNaN(amount) || amount <= 0) {
        alert("请输入有效的金额！");
        return;
      }

      store.finance.unshift({
        id: Date.now(),
        type,
        amount,
        note,
        date: selectedCalendarDate
      });

      document.getElementById('fin-amount').value = '';
      document.getElementById('fin-note').value = '';
      saveData();
    }

    function deleteFinance(id) {
      store.finance = store.finance.filter(f => f.id !== id);
      saveData();
    }

    function render() {
      document.getElementById('stat-pts').innerText = store.pts;
      document.getElementById('stat-repair').innerText = store.repairCards;
      
      const totalAsset = store.finance.reduce((acc, cur) => cur.type === 'inc' ? acc + cur.amount : acc - cur.amount, 0);
      document.getElementById('stat-asset').innerText = `￥${totalAsset.toFixed(2)}`;

      // 习惯渲染
      const habitBox = document.getElementById('habit-list');
      const dayCheckins = store.checkins[selectedCalendarDate] || [];
      
      habitBox.innerHTML = store.habits.map(h => {
        const checked = dayCheckins.includes(h.id);
        return `
          <div class="neo-box p-3 rounded-xl flex items-center justify-between bg-white">
            <div>
              <div class="font-black text-xs">${h.name}</div>
              <div class="text-[10px] text-amber-600 font-bold">+${h.pts}pt</div>
            </div>
            <button onclick="toggleCheckin(${h.id}, '${selectedCalendarDate}')" 
              class="neo-btn px-3 py-1.5 rounded-xl font-black text-xs ${
                checked ? 'bg-[#E2F0D9] text-green-800' : 'bg-gray-100 text-gray-400'
              }">
              ${checked ? '✓ 已打卡' : '未打卡'}
            </button>
          </div>
        `;
      }).join('') || '<p class="text-xs text-gray-400 italic">暂无习惯，点击右上角添加。</p>';

      // 四象限渲染（严格按 selectedCalendarDate 过滤）
      for (let i = 1; i <= 4; i++) {
        const quadBox = document.getElementById(`quad-${i}`);
        const items = store.todos.filter(t => t.quad === i && t.date === selectedCalendarDate);
        
        quadBox.innerHTML = items.map(t => `
          <div class="bg-white p-2 rounded-lg border-2 border-[#2A2E35] space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs flex items-center gap-1">
                <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTodo(${t.id})" class="accent-[#3157A4]">
                <span class="${t.done ? 'line-through text-gray-400' : ''}">${t.icon} ${t.title}</span>
              </span>
              <button onclick="deleteTodo(${t.id})" class="text-gray-400 hover:text-red-500 font-bold text-xs">×</button>
            </div>
            <div class="flex justify-between text-[10px] text-gray-400 font-bold">
              <span>⏰ ${t.time}</span>
              <span class="text-amber-500">+${t.pts}pt</span>
            </div>
          </div>
        `).join('') || '<p class="text-[10px] text-gray-400 italic">无事项</p>';
      }

      // 时间轴渲染
      const timelineBox = document.getElementById('timeline-list');
      const dayTodos = store.todos.filter(t => t.date === selectedCalendarDate);
      timelineBox.innerHTML = dayTodos.length > 0 ? dayTodos.map(t => `
        <div class="flex items-center gap-2 p-2 bg-white border-2 border-[#2A2E35] rounded-xl text-xs">
          <span class="bg-[#FFF2B8] px-2 py-0.5 rounded border border-[#2A2E35] font-black">${t.time}</span>
          <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTodo(${t.id})" class="accent-[#3157A4]">
          <span class="flex-1 font-bold ${t.done ? 'line-through text-gray-400' : ''}">${t.icon} ${t.title}</span>
          <span class="font-black text-amber-500">+${t.pts}</span>
          <button onclick="deleteTodo(${t.id})" class="text-gray-300 hover:text-red-500 font-bold">×</button>
        </div>
      `).join('') : '<p class="text-xs text-gray-400 italic text-center py-2">所选日期无待办事项</p>';

      // 收支记录渲染
      const finBox = document.getElementById('finance-list');
      finBox.innerHTML = store.finance.map(f => `
        <div class="flex justify-between items-center p-2.5 rounded-xl border-2 border-[#2A2E35] bg-white text-xs font-bold">
          <div>
            <span class="${f.type === 'inc' ? 'text-green-600' : 'text-red-500'} font-black text-sm">
              ${f.type === 'inc' ? '+' : '-'}${f.amount.toFixed(2)}
            </span>
            <span class="ml-2 text-gray-600">${f.note}</span>
          </div>
          <div class="flex items-center gap-2 text-gray-400 text-[10px]">
            <span>${f.date}</span>
            <button onclick="deleteFinance(${f.id})" class="text-gray-300 hover:text-red-500 font-bold text-xs">×</button>
          </div>
        </div>
      `).join('') || '<p class="text-xs text-gray-400 italic">暂无收支记录。</p>';
    }

    // 页面重新显示时检查跨日
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkDateUpdate();
      }
    });

    // 每 1 分钟检测一次是否跨零点
    setInterval(checkDateUpdate, 60000);

    // 初始化渲染
    checkDateUpdate();
    renderCalendar();
    render();
  </script>
</body>
</html>
